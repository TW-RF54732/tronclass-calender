<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="把雲科 TronClass 課程活動加入書籤，篩選作業與活動，切換表格和行事曆。">
  <title>課程活動 · TronClass 書籤</title>
  <style>
    * { box-sizing:border-box; }
    :root { color-scheme:light; font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif; color:#252a28; background:#fafbf8; }
    body { margin:0; min-height:100vh; padding:40px 24px; display:grid; place-items:center; }
    main { width:100%; max-width:560px; }
    .eyebrow { margin:0 0 24px; font-size:12px; letter-spacing:2px; color:#737d74; }
    h1 { margin:0; font-size:clamp(32px,7vw,44px); line-height:1.35; letter-spacing:-1.5px; font-weight:650; }
    .intro { margin:18px 0 0; font-size:16px; color:#6c756e; line-height:1.85; }
    .install { margin:38px 0; padding:30px 24px; border:1px solid #e2e7de; border-radius:18px; text-align:center; background:#fff; }
    .capsule { display:inline-flex; align-items:center; gap:12px; padding:15px 23px; background:#294737; color:white; text-decoration:none; border-radius:999px; font-size:16px; font-weight:550; box-shadow:0 4px 12px #2947371c; cursor:grab; transition:transform .15s,background .15s; }
    .capsule:hover { transform:translateY(-2px); background:#345641; }
    .capsule:active { cursor:grabbing; }
    .capsule svg { flex-shrink:0; pointer-events:none; }
    .grip { color:#aac0af; }
    .hint { margin:16px 0 0; color:#808a81; font-size:13px; }
    .star-prompt { margin:18px 0 0; padding:12px; background:#f2f6ee; border-radius:10px; font-size:14px; line-height:1.8; }
    .star-prompt a { display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:550; }
    .star-prompt svg { flex-shrink:0; }
    ol { list-style:none; counter-reset:step; padding:0; margin:0; display:grid; gap:18px; }
    li { counter-increment:step; display:flex; align-items:baseline; gap:12px; font-size:14px; line-height:1.8; color:#5e6960; }
    li::before { content:counter(step); flex-shrink:0; color:#718471; font-size:12px; width:23px; height:23px; line-height:23px; text-align:center; background:#eef2e9; border-radius:50%; }
    a { color:#294737; text-underline-offset:4px; }
    footer { margin-top:32px; padding-top:20px; border-top:1px solid #e2e7de; color:#8a938a; font-size:12px; display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:12px; }
    details { font-size:12px; color:#748076; }
    summary { cursor:pointer; }
    .fallback { margin-top:24px; }
    .fallback p { line-height:1.8; }
    textarea { width:100%; height:80px; margin:8px 0; padding:10px; border:1px solid #dbe2d7; border-radius:8px; background:white; color:#5e6960; resize:vertical; font:12px/1.5 monospace; }
    button { border:1px solid #dbe2d7; background:white; color:#294737; border-radius:7px; padding:7px 12px; font:inherit; cursor:pointer; }
    #status { display:block; min-height:20px; margin-top:8px; color:#69776b; }
    .versions { margin-top:8px; display:grid; gap:6px; max-height:160px; overflow:auto; }
    .versions a { display:block; }
    a:focus-visible,button:focus-visible,summary:focus-visible,textarea:focus-visible { outline:3px solid #96b69a; outline-offset:4px; }
    @media(prefers-reduced-motion:reduce) { .capsule { transition:none; } }
    @media(max-width:420px) { body { padding:32px 20px; } .install { padding:26px 16px; } footer { flex-direction:column; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">YUNTECH / TRONCLASS</p>
    <h1>課程活動，<br>一個書籤就能看。</h1>
    <p class="intro">把作業與課程活動放在一起。<br>複選類型、查看表格，或切換成行事曆。</p>
    <div class="install">
      <a id="bookmark" class="capsule" href="__BOOKMARKLET__" draggable="true" title="拖曳到瀏覽器書籤列">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 11h18M8 15h2M14 15h2"/></svg>
        <span>雲科課程活動</span>
        <svg class="grip" aria-hidden="true" width="12" height="18" viewBox="0 0 12 18" fill="currentColor"><circle cx="4" cy="4" r="1"/><circle cx="9" cy="4" r="1"/><circle cx="4" cy="9" r="1"/><circle cx="9" cy="9" r="1"/><circle cx="4" cy="14" r="1"/><circle cx="9" cy="14" r="1"/></svg>
      </a>
      <p id="drag-hint" class="hint" role="status">拖曳這顆膠囊，放進瀏覽器書籤列。</p>
      <p id="star-prompt" class="star-prompt" aria-live="polite" hidden>
        <a href="https://github.com/TW-RF54732/tronclass-calender" target="_blank" rel="noopener noreferrer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          <span>如果喜歡的話，幫忙按一個星星吧 ⭐</span>
        </a>
      </p>
    </div>
    <ol>
      <li><span>把上方膠囊拖入書籤列。</span></li>
      <li><span>開啟 <a href="https://eclass.yuntech.edu.tw" target="_blank" rel="noopener noreferrer">TronClass</a> 並登入。</span></li>
      <li><span>在 TronClass 網頁點擊「雲科課程活動」書籤。</span></li>
    </ol>
    <details class="fallback">
      <summary>無法拖曳？手動加入書籤</summary>
      <p>新增書籤，名稱填「雲科課程活動」，網址貼入以下完整內容，包含開頭的 javascript:。</p>
      <textarea id="code" readonly aria-label="完整書籤網址" spellcheck="false">__CODE__</textarea>
      <button id="copy" type="button">複製書籤網址</button>
      <span id="status" role="status"></span>
    </details>
    <footer>
      <span>__VERSION__ · 台灣時間</span>
      <details><summary>其他版本</summary><nav class="versions" aria-label="書籤版本">__VERSIONS__</nav></details>
    </footer>
  </main>
  <script>
    document.getElementById('bookmark').addEventListener('dragend', () => {
      document.getElementById('star-prompt').hidden = false;
    }, { once: true });
    document.getElementById('bookmark').addEventListener('click', (event) => {
      event.preventDefault();
      document.getElementById('drag-hint').textContent = '按住膠囊拖到書籤列，安裝後在 TronClass 點擊書籤。';
    });
    document.getElementById('copy').addEventListener('click', async () => {
      const code = document.getElementById('code');
      code.focus();
      code.select();
      try {
        await navigator.clipboard.writeText(code.value);
        document.getElementById('status').textContent = '已複製，可以貼到書籤網址。';
      } catch {
        document.getElementById('status').textContent = '內容已選取，請按 Ctrl+C（Mac：⌘C）複製。';
      }
    });
  </script>
</body>
</html>
