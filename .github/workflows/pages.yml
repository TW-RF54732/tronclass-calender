name: Publish bookmarklet website

on:
  push:
    tags:
      - 'bookmarklet-v*'
      - 'v*' # Legacy bookmarklet releases

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release and all tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build latest install page and archived versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python bookmarklet/tools/build-bookmarklet.py --output dist --version "$RELEASE_TAG" --include-tags

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
